# nextest repository configuration (https://nexte.st/book/config.html)
#
# LUMEN_ALLOC_TRACE=1 arms testkit's CountingGuard backtrace capture
# (crates/testkit/src/alloc_count.rs): a zero-allocation assertion that
# fails inside a nextest run prints the exact allocation sites instead
# of a bare "N bytes across M events" count. Cheap by construction -
# captures fire only for events INSIDE a guard window, and zero-alloc
# windows are empty by definition (the env var is inert without one).
#
# The CI gate's plain `cargo test` runs are unaffected: this file is
# nextest-only. Born from audit run 29 (quality tier, 2026-11-17): the
# first working coverage run found
# audio-output::zero_alloc_null_sink failing under instrumentation
# with "900 bytes across 4 events" and no way to name the sites.
[env]
LUMEN_ALLOC_TRACE = "1"
